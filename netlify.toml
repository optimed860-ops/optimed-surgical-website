# Netlify build settings. Netlify detects Next.js and adds its Next.js runtime automatically.
# Set the environment variables (see README "Deploy to Netlify") in Site configuration → Environment variables.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # These hold public defaults (not secrets) that also appear in the code and docs,
  # so Netlify's secret scanner must not block the deploy because of them.
  SECRETS_SCAN_OMIT_KEYS = "EMAIL_FROM,SMTP_HOST,SMTP_PORT"
